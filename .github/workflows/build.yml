name: APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/overlord-tv.apk
          ls -la dist

      - name: Als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: overlord-tv-apk
          path: dist/overlord-tv.apk
          if-no-files-found: error

      # Jeder Push aktualisiert zusätzlich das Release „latest“:
      # feste Download-Adresse für die Downloader-App auf dem Fire TV.
      - name: Release „latest“ aktualisieren
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Overlord TV (neuester Build)
          prerelease: false
          make_latest: true
          files: dist/overlord-tv.apk
          body: |
            Automatisch gebaut aus ${{ github.sha }}.
            Download auf dem Fire TV (Downloader-App):
            https://github.com/${{ github.repository }}/releases/latest/download/overlord-tv.apk
