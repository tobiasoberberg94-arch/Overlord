name: APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Neuere Pushes brechen ältere, noch laufende Builds desselben Branches ab
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/overlord-tv.apk
          ls -la dist

      - name: Als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: overlord-tv-apk
          path: dist/overlord-tv.apk
          if-no-files-found: error

      # Jeder Push aktualisiert zusätzlich das Release „latest“:
      # feste Download-Adresse für die Downloader-App auf dem Fire TV.
      - name: Release „latest“ aktualisieren
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Overlord TV (neuester Build)
          prerelease: false
          make_latest: true
          files: dist/overlord-tv.apk
          body: |
            Automatisch gebaut aus ${{ github.sha }}.
            Download auf dem Fire TV (Downloader-App):
            https://github.com/${{ github.repository }}/releases/latest/download/overlord-tv.apk

  # Screenshots im Android-TV-Emulator (zur Kontrolle der Oberfläche).
  # Die Bilder landen als Artifact und als Dateien am Release „latest“.
  screenshots:
    name: Screenshots (Android-TV-Emulator)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: overlord-tv-apk
          path: dist

      - name: Demo-Medien vorbereiten (ffmpeg, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core > /dev/null
          bash .github/scripts/demo-media.sh

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator starten und Screenshots aufnehmen
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/screenshots.sh

      - name: Screenshots als Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn

      - name: Screenshots am Release ablegen
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: shots/*.png
